name: options-desk
origin: own
lifecycle: incubating       # 2026-08-28 立。UI 已写(4 个 Sources + 10 张模拟器截图,首屏与 Live
                            # 数据源端到端跑通);**没装机、API 没上线**。装上并日常在用 → 改 active
form: ios

one_liner: 投资盘面 —— 随时一眼看到净值 / 累计收益 / 对 QQQ 的超额 / buffer / 票据梯子,数据来自每日复盘那条链

stack: swift-ui

function: |
  期权仓位的**只读盘面**。回答「我现在怎么样」,不回答「如果我开这个结构会怎样」——
  后者是姊妹 app `options-calc`(期权决策台),两个刻意分开:那个是纯函数计算器,
  零网络零凭证离线可跑;这个天天变、要联网要凭证要缓存。合并会把最稳的那个变成最复杂的。

key_scripts:
  - install-to-iphone.sh    # shim → 总部 SSOT
  - sim-run.sh              # shim → 总部 SSOT
  - make_icon.py            # 图标

depends_on:
  - ~/investment/data/quant.db                                  # 数据真相(rh_history / rh_group_pnl / rh_*_positions)
  - ~/investment/options/robinhood/review_run.py                # 每日复盘引擎 + 同步挂载点
  - ~/Dev/stations/web-stack/services/stockoptions/api.py       # 只读 API(复用,不新建)
  - ~/Dev/tools/dev/lib/tools/macapp/ios/                       # 装机/设备探测/Xcode 挑选 SSOT

notes: |
  **不造第二个账本。** 数据链已经存在且活着:
      Robinhood MCP → quant.db(rh_*) → review_run.py --facts → 每日复盘正文+配图
  本 app 是这条链的消费端。要新建的只有「把 quant.db 暴露成只读 API」,
  而那个服务也已存在(stockoptions/api.py),重新指向 quant.db 即可。

  **前身 cc-options 死过一次**(2026-08-28 查证):数据停在 06-01、LaunchAgent 没了、
  VPS service 没了、子域不在注册表 —— 而且**没有任何东西报警**。死因是同步挂在
  「Mac 得在 17:00 醒着」的 LaunchAgent 上。所以新设计把同步挂进 review_run.py
  (用户每天写复盘必跑),并要求陈旧在界面上刺眼。
